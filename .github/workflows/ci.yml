name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run lint
        shell: bash
        run: |
          if npm run | grep -qE '^[[:space:]]+lint$'; then
            npm run lint
          else
            echo "No lint script found, skipping."
          fi

      - name: Run tests
        shell: bash
        env:
          CI: true
        run: |
          if npm run | grep -qE '^[[:space:]]+test$'; then
            npm test -- --runInBand
          else
            echo "No test script found, skipping."
          fi

      - name: Build project
        shell: bash
        run: npm run build

      - name: Create build.zip
        shell: bash
        run: |
          set -euo pipefail
          if [ -d dist ]; then
            zip -r build.zip dist
          elif [ -d build ]; then
            zip -r build.zip build
          else
            echo "No build output directory found. Expected 'dist' or 'build'."
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build.zip
          path: build.zip
          if-no-files-found: error

      - name: Deploy to Creator
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          CREATOR_USER_TOKEN: ${{ secrets.CREATOR_USER_TOKEN }}
        run: |
          curl --fail --show-error --max-time 120 \
            -X POST \
            -H "Authorization: $CREATOR_USER_TOKEN" \
            -F "file=@build.zip" \
            "https://creator.qa.api.onereach.ai/api/git-deploy/github/bd65c3c8-d0f9-412a-9f61-9143a91bc984"